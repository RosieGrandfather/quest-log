<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>远征日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F4;
  --surface:#FFFFFF;
  --surface-2:#E3E9EE;
  --ink:#12202B;
  --ink-soft:#54626D;
  --ink-faint:#8894A0;
  --border:#D6DCE2;
  --accent:#C07F1F;
  --accent-ink:#5A3A0E;
  --accent-soft:#F4E4C8;
  --teal:#1C7A68;
  --teal-soft:#DCEFEA;
  --burgundy:#7C2049;
  --burgundy-soft:#F1DDE7;
  --danger:#B23A2E;
  --shadow:0 1px 2px rgba(18,32,43,0.06),0 10px 28px rgba(18,32,43,0.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E161F; --surface:#16212B; --surface-2:#1C2833; --ink:#E9EEF2; --ink-soft:#9FAEB9; --ink-faint:#6C7A87;
    --border:#2A3947; --accent:#E3A63D; --accent-ink:#2A1B05; --accent-soft:#3A2C10; --teal:#48B69D; --teal-soft:#123028;
    --burgundy:#D07AA3; --burgundy-soft:#3A1B29; --danger:#E0705F; --shadow:0 1px 2px rgba(0,0,0,0.35),0 12px 28px rgba(0,0,0,0.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161F; --surface:#16212B; --surface-2:#1C2833; --ink:#E9EEF2; --ink-soft:#9FAEB9; --ink-faint:#6C7A87;
  --border:#2A3947; --accent:#E3A63D; --accent-ink:#2A1B05; --accent-soft:#3A2C10; --teal:#48B69D; --teal-soft:#123028;
  --burgundy:#D07AA3; --burgundy-soft:#3A1B29; --danger:#E0705F; --shadow:0 1px 2px rgba(0,0,0,0.35),0 12px 28px rgba(0,0,0,0.4);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-inline:16px;
}
[hidden]{display:none!important;}
img{max-width:100%;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.app{max-width:640px;margin:0 auto;padding-block:20px 60px;}

/* auth gate */
.gate{
  max-width:420px;margin:18vh auto 0;text-align:center;
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:36px 24px;box-shadow:var(--shadow);
}
.gate h1{font-family:'Barlow Condensed';font-size:30px;margin:0 0 6px;}
.gate p{color:var(--ink-soft);font-size:14px;margin:0 0 22px;}
.btn-google{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--ink);color:var(--bg);border:none;border-radius:12px;
  padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;
}
.gate-note{margin-top:16px;font-size:12px;color:var(--ink-faint);}

.topbar{display:flex;justify-content:flex-end;margin-bottom:6px;}
.signout{background:none;border:none;color:var(--ink-faint);font-size:12.5px;cursor:pointer;text-decoration:underline;}

/* header / hero */
.hero{
  background:linear-gradient(155deg,var(--surface) 0%,var(--surface-2) 100%);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px 20px 20px;
  box-shadow:var(--shadow);
}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.eyebrow{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  font-size:13px;
  color:var(--ink-faint);
}
.streak{
  display:flex;align-items:center;gap:6px;
  background:var(--accent-soft);color:var(--accent-ink);
  border-radius:999px;padding:5px 12px;
  font-size:13px;font-weight:700;
}
.streak .flame{font-size:14px;}
.level-block{margin-top:14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.level-name{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:34px;line-height:1;
  color:var(--ink);
}
.level-sub{
  font-family:'IBM Plex Mono',monospace;
  font-size:14px;color:var(--accent);font-weight:600;
  background:var(--accent-soft);padding:3px 9px;border-radius:8px;
}
.xpbar-wrap{margin-top:14px;position:relative;}
.xpbar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
.xpbar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:999px;transition:width .5s ease;width:0%;}
.xp-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--ink-faint);}
.xp-labels .mono{color:var(--ink-soft);}
.stat-row{display:flex;gap:10px;margin-top:16px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 8px;text-align:center;}
.stat-num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;color:var(--ink);}
.stat-label{font-size:11px;color:var(--ink-faint);margin-top:2px;}

/* tabs */
.tabs{display:flex;gap:6px;margin-top:18px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;}
.tab{flex:1;background:transparent;border:none;border-radius:11px;padding:9px 6px;font-family:'Manrope';font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer;}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

main{margin-top:16px;}
.panel{display:flex;flex-direction:column;gap:16px;}

.btn-primary{
  background:var(--ink);color:var(--bg);
  border:none;border-radius:13px;padding:13px 18px;
  font-family:'Manrope';font-weight:700;font-size:15px;cursor:pointer;
  box-shadow:var(--shadow);
}
.btn-primary:active{transform:translateY(1px);}
.btn-ghost{
  background:transparent;border:1.5px dashed var(--border);color:var(--ink-soft);
  border-radius:13px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;
}

.recent h3, .panel h3{font-family:'Barlow Condensed';font-weight:700;font-size:19px;letter-spacing:.01em;margin:0 0 8px;}

.entry-list{display:flex;flex-direction:column;gap:8px;}
.entry-empty{color:var(--ink-faint);font-size:14px;padding:18px 4px;text-align:center;border:1px dashed var(--border);border-radius:14px;}
.entry-card{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--border);border-radius:13px;
  padding:11px 13px;
}
.entry-chip{
  font-size:11px;font-weight:700;letter-spacing:.02em;
  padding:3px 8px;border-radius:7px;white-space:nowrap;
  background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border);
}
.entry-chip.spend{background:var(--burgundy-soft);color:var(--burgundy);border-color:transparent;}
.entry-body{flex:1;min-width:0;}
.entry-label{font-size:14px;font-weight:600;color:var(--ink);overflow-wrap:anywhere;}
.entry-meta{font-size:11.5px;color:var(--ink-faint);margin-top:1px;}
.entry-amount{font-family:'IBM Plex Mono';font-weight:600;font-size:14.5px;white-space:nowrap;}
.entry-amount.earn{color:var(--teal);}
.entry-amount.spend{color:var(--burgundy);}

.history-day{margin-bottom:4px;}
.history-day-label{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-faint);margin:14px 0 6px;letter-spacing:.02em;}
.history-day-label:first-child{margin-top:0;}

/* rewards */
.tier-block{margin-bottom:6px;}
.tier-title{
  display:flex;align-items:center;gap:8px;
  font-family:'Barlow Condensed';font-weight:700;font-size:18px;margin:2px 0 10px;
}
.tier-title .sec-actions{margin-left:auto;display:flex;gap:2px;font-family:inherit;}
.add-btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.add-btn-row .btn-ghost{flex:1;min-width:140px;}
.tier-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.tier-dot.small{background:var(--teal);}
.tier-dot.medium{background:var(--accent);}
.tier-dot.big{background:var(--burgundy);}
.reward-grid{display:flex;flex-direction:column;gap:10px;}
.reward-card{
  background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:14px;
  display:flex;flex-direction:column;gap:8px;
}
.reward-top{display:flex;justify-content:space-between;gap:10px;align-items:center;}
.reward-icon-badge{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;}
.reward-icon-badge svg{display:block;}
.reward-name-wrap{flex:1;min-width:0;}
.reward-name{font-weight:700;font-size:15px;}
.reward-cost{font-family:'IBM Plex Mono';font-weight:600;font-size:13px;color:var(--ink-soft);white-space:nowrap;}
.reward-bar{height:7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
.reward-bar-fill{height:100%;border-radius:999px;transition:width .4s ease;}
.reward-bar-fill.small{background:var(--teal);}
.reward-bar-fill.medium{background:var(--accent);}
.reward-bar-fill.big{background:var(--burgundy);}
.reward-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.reward-hint{font-size:12px;color:var(--ink-faint);}
.reward-btn-row{display:flex;gap:6px;}
.btn-redeem{
  border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;
  background:var(--ink);color:var(--bg);
}
.btn-redeem:disabled{background:var(--surface-2);color:var(--ink-faint);cursor:not-allowed;}
.btn-redeem.confirming{background:var(--danger);color:#fff;}
.btn-del{background:transparent;border:none;color:var(--ink-faint);font-size:12px;cursor:pointer;padding:6px 4px;}
.btn-del.confirming{color:var(--danger);font-weight:700;}
.btn-edit{background:transparent;border:none;color:var(--ink-faint);font-size:12px;cursor:pointer;padding:6px 4px;margin-right:auto;}
.btn-edit:hover{color:var(--ink);}

/* modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(14,22,31,0.5);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
}
@media (min-width:520px){ .modal-backdrop{align-items:center;} }
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px 20px 0 0;
  width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow);
}
@media (min-width:520px){ .modal{border-radius:20px;} }
.modal h3{font-family:'Barlow Condensed';font-size:21px;font-weight:700;margin:0 0 14px;}
.modal label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:12px 0 5px;}
.modal label:first-of-type{margin-top:0;}
.modal input, .modal select{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:10px 11px;font-size:14.5px;color:var(--ink);font-family:'Manrope';
}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn-ghost, .modal-actions .btn-primary{flex:1;text-align:center;}
.form-error{color:var(--danger);font-size:13px;margin-top:8px;}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);z-index:60;max-width:88vw;text-align:center;
}
.db-error{
  margin-top:40px;text-align:center;color:var(--ink-soft);
  border:1px dashed var(--border);border-radius:16px;padding:30px 18px;
}
.celebrate-modal{ text-align:center; position:relative; overflow:hidden; }
.celebrate-emoji{ font-size:44px; margin-bottom:2px; }
.celebrate-text{ font-size:15px; color:var(--ink-soft); margin:8px 0 20px; line-height:1.6; }
.confetti-wrap{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.confetti-piece{ position:absolute; top:-14px; width:8px; height:14px; opacity:0.9; border-radius:2px; animation:confetti-fall linear forwards; }
@keyframes confetti-fall{ to{ transform: translateY(360px) rotate(540deg); opacity:0; } }
</style>
</head>
<body>

<div class="app">
  <div class="gate" id="gate">
    <h1>远征日志</h1>
    <p>登录你自己的 Google 账号，数据只属于你，手机电脑自动同步。</p>
    <button class="btn-google" id="signInBtn">用 Google 账号登录</button>
    <div class="gate-note" id="gateNote"></div>
  </div>

  <div id="appRoot" hidden>
    <div class="topbar">
      <button class="signout" id="signOutBtn">退出登录</button>
    </div>
    <header class="hero">
      <div class="hero-top">
        <span class="eyebrow">远征日志 · Yijia 的 AI 转型任务</span>
        <div class="streak"><span class="flame">🔥</span><span class="mono" id="streakNum">0</span>&nbsp;天连续</div>
      </div>
      <div class="level-block">
        <div class="level-name" id="levelName">新手上路</div>
        <div class="level-sub" id="levelSub">Lv.1</div>
      </div>
      <div class="xpbar-wrap">
        <div class="xpbar"><div class="xpbar-fill" id="xpFill"></div></div>
        <div class="xp-labels"><span class="mono" id="xpNowLabel">0 XP</span><span id="xpNextLabel">/ 100 到下一级</span></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat-num" id="balanceNum">0</div><div class="stat-label">可用积分</div></div>
        <div class="stat"><div class="stat-num" id="totalNum">0</div><div class="stat-label">累计获得</div></div>
        <div class="stat"><div class="stat-num" id="entriesNum">0</div><div class="stat-label">记录次数</div></div>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="log">记录</button>
      <button class="tab" data-tab="rewards">奖励商店</button>
      <button class="tab" data-tab="history">历史</button>
    </nav>

    <main id="main">
      <section class="panel" id="panel-log">
        <div id="tasksWrap"></div>
        <div class="add-btn-row">
          <button class="btn-ghost" id="openAddTask">＋ 添加自定义任务</button>
          <button class="btn-ghost" id="openAddSection">＋ 添加自定义板块</button>
        </div>
        <div class="recent">
          <h3>最近记录</h3>
          <div id="recentList" class="entry-list"></div>
        </div>
      </section>

      <section class="panel" id="panel-rewards" hidden>
        <div id="rewardsWrap"></div>
        <button class="btn-ghost" id="openAddReward">＋ 添加自定义奖励</button>
      </section>

      <section class="panel" id="panel-history" hidden>
        <h3>完整历史</h3>
        <div id="historyList" class="entry-list"></div>
      </section>
    </main>
  </div>

  <div class="db-error" id="dbError" hidden></div>
</div>


<div class="modal-backdrop" id="rewardModal" hidden>
  <div class="modal">
    <h3 id="rewardModalTitle">添加自定义奖励</h3>
    <label>奖励名称</label>
    <input id="rewardName" type="text" placeholder="比如：去巴厘岛浮潜三天">
    <label>档位</label>
    <select id="rewardTier">
      <option value="small">日常小奖励</option>
      <option value="medium">中型奖励</option>
      <option value="big">终极大奖</option>
    </select>
    <label>需要多少积分</label>
    <input id="rewardCost" type="number" inputmode="numeric" min="0">
    <div class="form-error" id="rewardFormError" hidden></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelReward">取消</button>
      <button class="btn-primary" id="submitReward">添加</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="redeemConfirmModal" hidden>
  <div class="modal">
    <h3>确认兑换</h3>
    <p id="redeemConfirmText" style="font-size:14.5px;color:var(--ink-soft);margin:0 0 6px;"></p>
    <div class="form-error" id="redeemConfirmError" hidden></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelRedeemConfirm">取消</button>
      <button class="btn-primary" id="confirmRedeemBtn">确认兑换</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="taskModal" hidden>
  <div class="modal">
    <h3 id="taskModalTitle">添加自定义任务</h3>
    <label>任务名称</label>
    <input id="taskName" type="text" placeholder="比如：读完一篇论文精读笔记">
    <label>类别</label>
    <select id="taskCategory"></select>
    <label>完成一次获得多少积分</label>
    <input id="taskPoints" type="number" inputmode="numeric" min="0">
    <div class="form-error" id="taskFormError" hidden></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelTask">取消</button>
      <button class="btn-primary" id="submitTask">添加</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="sectionModal" hidden>
  <div class="modal">
    <h3 id="sectionModalTitle">添加自定义板块</h3>
    <label>板块名称</label>
    <input id="sectionName" type="text" maxlength="30" placeholder="比如：英语学习 / 健身 / 读书">
    <div class="form-error" id="sectionFormError" hidden></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelSection">取消</button>
      <button class="btn-primary" id="submitSection">添加</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="taskConfirmModal" hidden>
  <div class="modal">
    <h3>确认完成</h3>
    <p id="taskConfirmText" style="font-size:14.5px;color:var(--ink-soft);margin:0 0 6px;"></p>
    <div class="form-error" id="taskConfirmError" hidden></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelTaskConfirm">取消</button>
      <button class="btn-primary" id="confirmTaskBtn">确认完成</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="celebrateModal" hidden>
  <div class="modal celebrate-modal">
    <div class="confetti-wrap" id="confettiWrap"></div>
    <div class="celebrate-emoji">🎉</div>
    <h3>恭喜！</h3>
    <p id="celebrateText" class="celebrate-text"></p>
    <button class="btn-primary" id="closeCelebrate" style="width:100%">太棒了</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ============ 新用户模板（首次登录时写进这个用户自己的数据库，之后只读数据库） ============
   文档 ID 固定，这样即使手机和电脑同时首次登录，重复写入也只是覆盖成同样的内容。 */
const SEED_SECTIONS = [
  {id:'mind', label:'精神食粮', ts:1},
  {id:'body', label:'身体', ts:2},
  {id:'life', label:'生活', ts:3},
];
const SEED_TASKS = [
  {id:'seed-t1', name:'读 10 页书', category:'mind', points:10, ts:1},
  {id:'seed-t2', name:'学会一个新知识点', category:'mind', points:15, ts:2},
  {id:'seed-t3', name:'运动 30 分钟', category:'body', points:15, ts:3},
  {id:'seed-t4', name:'23:00 前睡觉', category:'body', points:10, ts:4},
  {id:'seed-t5', name:'整理房间 15 分钟', category:'life', points:10, ts:5},
  {id:'seed-t6', name:'自己做一顿饭', category:'life', points:10, ts:6},
];
const SEED_REWARDS = [
  {id:'seed-r1', name:'一杯奶茶 / 咖啡', tier:'small', cost:50, ts:1},
  {id:'seed-r2', name:'看一场电影', tier:'small', cost:100, ts:2},
  {id:'seed-r3', name:'买一件想要的小东西', tier:'medium', cost:300, ts:3},
  {id:'seed-r4', name:'一次旅行', tier:'big', cost:1000, ts:4},
];

/* 老版本写死在代码里的 7 个板块。只在老账号迁移（schemaVersion < 2）时用一次：
   用原来的 id 当文档 ID 写进 sections，所以老任务 / 老记录的 category 不用改。 */

function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function iconForReward(r){

  return REWARD_ICONS[hashStr(key) % REWARD_ICONS.length];
}

/* 登录后先跑一次：新用户写入模板；老账号把代码里的板块迁移进数据库。
   完成后在 meta/app 里记 schemaVersion，之后不再执行。每一步都可以安全地重复执行。 */
async function ensureUserData(){
  const metaRef = fs.collection('users').doc(uid).collection('meta').doc('app');
  try{
    const meta = await metaRef.get();
    if(meta.exists && (meta.data().schemaVersion||0) >= SCHEMA_VERSION) return;
    const [t, r, sec] = await Promise.all([tasksCol.limit(1).get(), rewardsCol.limit(1).get(), sectionsCol.get()]);
    if(t.empty && r.empty && sec.empty) await seedNewUser();
    else await migrateLegacySections(sec);
    await metaRef.set({schemaVersion:SCHEMA_VERSION, migratedAt:Date.now()}, {merge:true});
  }catch(e){ console.error('ensureUserData failed', e); }
}
async function seedNewUser(){
  const batch = fs.batch();
  SEED_SECTIONS.forEach(({id, ...d})=> batch.set(sectionsCol.doc(id), d));
  SEED_TASKS.forEach(({id, ...d})=> batch.set(tasksCol.doc(id), {...d, active:true}));
  SEED_REWARDS.forEach(({id, ...d})=> batch.set(rewardsCol.doc(id), {...d, active:true}));
  await batch.commit();
}
async function migrateLegacySections(existingSnap){
  const existing = new Set(existingSnap.docs.map(d=>d.id));
  const writes = [];
  // 7 个老板块，已存在的（比如已经改过名）不覆盖。「其他」排在已有自定义板块后面
  LEGACY_SECTIONS.forEach((c, i)=>{
    if(existing.has(c.id)) return;
    const ts = c.id==='custom' ? Date.now() : i+1;
    writes.push(b=> b.set(sectionsCol.doc(c.id), {label:c.label, short:c.short, ts}));
  });
  // 上一版自定义板块在任务 / 记录里存成 'sec_' + 文档 ID，统一成直接用文档 ID
  const prefixed = col => col.where('category','>=','sec_').where('category','<','sec_\uf8ff').get();
  const [pt, pl] = await Promise.all([prefixed(tasksCol), prefixed(logCol)]);
  [...pt.docs, ...pl.docs].forEach(d=>{
    writes.push(b=> b.update(d.ref, {category: d.data().category.slice(4)}));
  });
  for(let i=0; i<writes.length; i+=400){
    const batch = fs.batch();
    writes.slice(i, i+400).forEach(w=> w(batch));
    await batch.commit();
  }
}

/* 每日上线奖励：每天第一次打开就加 DAILY_LOGIN_POINTS 分，每天最多一次。
   用固定的文档 ID（daily-YYYY-MM-DD）+ 事务，手机和电脑同时打开也只会记一次。 */
let dailyCheckedISO = null;
async function ensureDailyLoginBonus(){
  if(!logCol) return;
  const today = localISO(new Date());
  if(dailyCheckedISO===today) return;
  dailyCheckedISO = today;
  const ref = logCol.doc('daily-'+today);
  try{
    const created = await fs.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      if(snap.exists) return false;
      tx.set(ref, {kind:'earn', category:'daily', label:'每日上线', amount:DAILY_LOGIN_POINTS, note:'', dateISO:today, ts:Date.now()});
      return true;
    });
    if(created) showToast(`今日上线 +${DAILY_LOGIN_POINTS} 积分 ✨`);
  }catch(e){
    dailyCheckedISO = null;
    console.error('daily login bonus failed', e);
  }
}
/* 页面一直开着跨过零点，或者从后台切回来时，也补发当天的奖励 */
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) ensureDailyLoginBonus(); });
setInterval(ensureDailyLoginBonus, 60*1000);

function subscribeAll(){
  unsubLog = logCol.orderBy('ts','desc').limit(500).onSnapshot(snap=>{
    logEntries = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>{ console.error('log snapshot error', err); });
  unsubTasks = tasksCol.orderBy('ts','asc').limit(300).onSnapshot(snap=>{
    tasks = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(t=> t.active!==false);
    render();
  }, err=>{ console.error('tasks snapshot error', err); });
  unsubSections = sectionsCol.orderBy('ts','asc').limit(100).onSnapshot(snap=>{
    sections = snap.docs.map(d=>({id:d.id, label:d.data().label||'未命名板块', short:d.data().short||'', ts:d.data().ts}));
    render();
  }, err=>{ console.error('sections snapshot error', err); });
  unsubRewards = rewardsCol.orderBy('cost','asc').limit(100).onSnapshot(snap=>{
    rewards = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(r=> r.active!==false);
    render();
  }, err=>{ console.error('rewards snapshot error', err); });
}

function localISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDateLabel(iso){
  const today = localISO(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = localISO(y);
  if(iso===today) return '今天';
  if(iso===yesterday) return '昨天';
  return iso;
}

function computeStats(){
  let totalEarned=0, totalSpent=0, entriesCount=0;
  const earnDates = new Set();
  logEntries.forEach(e=>{
    if(e.kind==='earn'){
      totalEarned += Number(e.amount)||0;
      if(e.dateISO) earnDates.add(e.dateISO);
      // 每日上线奖励算积分和连续打卡，但不算"记录次数"
      if(e.category!=='daily') entriesCount++;
    }
    else if(e.kind==='spend'){ totalSpent += Number(e.amount)||0; }
  });
  return {totalEarned, totalSpent, balance: totalEarned-totalSpent, entriesCount, streak: computeStreak(earnDates)};
}
function computeStreak(datesSet){
  let cursor = new Date();
  if(!datesSet.has(localISO(cursor))){
    cursor.setDate(cursor.getDate()-1);
    if(!datesSet.has(localISO(cursor))) return 0;
  }
  let streak=0;
  while(datesSet.has(localISO(cursor))){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}
function levelInfo(total){
  let idx=0;
  for(let i=0;i<LEVELS.length;i++){ if(total>=LEVELS[i].min) idx=i; }
  const cur = LEVELS[idx];
  const next = LEVELS[idx+1];
  if(next){
    return {name:cur.name, sub:`Lv.${idx+1}`, curMin:cur.min, nextMin:next.min};
  }
  const over = total - cur.min;
  const stage = Math.floor(over/5000);
  const stageMin = cur.min + stage*5000;
  return {name:cur.name, sub:`Lv.${LEVELS.length+stage}`, curMin:stageMin, nextMin:stageMin+5000};
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.hidden = true; }, 2600);
}

function render(){
  const s = computeStats();
  document.getElementById('balanceNum').textContent = s.balance;
  document.getElementById('totalNum').textContent = s.totalEarned;
  document.getElementById('entriesNum').textContent = s.entriesCount;
  document.getElementById('streakNum').textContent = s.streak;
  const lvl = levelInfo(s.totalEarned);
  document.getElementById('levelName').textContent = lvl.name;
  document.getElementById('levelSub').textContent = lvl.sub;
  const span = lvl.nextMin - lvl.curMin;
  const pct = span>0 ? Math.min(100, Math.max(0, (s.totalEarned-lvl.curMin)/span*100)) : 100;
  document.getElementById('xpFill').style.width = pct+'%';
  document.getElementById('xpNowLabel').textContent = s.totalEarned+' XP';
  document.getElementById('xpNextLabel').textContent = `/ ${lvl.nextMin} 到下一级`;
  renderRecent();
  renderHistory();
  renderRewards(s.balance);
  renderTasks();
}

function entryCardHTML(e){
  const chipCls = e.kind==='spend' ? 'entry-chip spend' : 'entry-chip';
  const chipText = e.kind==='spend' ? '兑换' : categoryShort(e.category);
  const sign = e.kind==='spend' ? '-' : '+';
  const amtCls = e.kind==='spend' ? 'spend' : 'earn';
  const meta = [fmtDateLabel(e.dateISO)];
  if(e.note) meta.push(e.note);
  return `<div class="entry-card">
    <span class="${chipCls}">${chipText}</span>
    <div class="entry-body">
      <div class="entry-label">${escapeHTML(e.label||'')}</div>
      <div class="entry-meta">${escapeHTML(meta.join(' · '))}</div>
    </div>
    <div class="entry-amount ${amtCls} mono">${sign}${e.amount}</div>
  </div>`;
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderRecent(){
  const el = document.getElementById('recentList');
  const items = logEntries.slice(0,6);
  el.innerHTML = items.length ? items.map(entryCardHTML).join('') : '<div class="entry-empty">还没有记录，点上面的按钮记下第一笔吧</div>';
}
function renderHistory(){
  const el = document.getElementById('historyList');
  if(!logEntries.length){ el.innerHTML = '<div class="entry-empty">还没有历史记录</div>'; return; }
  const byDate = {};
  logEntries.forEach(e=>{
    const key = e.dateISO || '未知日期';
    (byDate[key] = byDate[key]||[]).push(e);
  });
  const dates = Object.keys(byDate).sort((a,b)=> a<b?1:-1);
  el.innerHTML = dates.map(d=>`
    <div class="history-day">
      <div class="history-day-label">${fmtDateLabel(d)}</div>
      ${byDate[d].map(entryCardHTML).join('')}
    </div>`).join('');
}

function renderRewards(balance){
  const wrap = document.getElementById('rewardsWrap');
  if(!rewards.length){
    wrap.innerHTML = '<div class="entry-empty">还没有奖励，点下面添加第一个吧</div>';
    return;
  }
  const groups = {small:[], medium:[], big:[]};
  rewards.forEach(r=>{ if(groups[r.tier]) groups[r.tier].push(r); });
  wrap.innerHTML = Object.keys(TIER_META).map(tier=>{
    const items = groups[tier];
    if(!items.length) return '';
    const meta = TIER_META[tier];
    return `<div class="tier-block">
      <div class="tier-title"><span class="tier-dot ${meta.cls}"></span>${meta.title}</div>
      <div class="reward-grid">${items.map(r=>rewardCardHTML(r, balance, meta.cls)).join('')}</div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-redeem]').forEach(btn=>{
    btn.addEventListener('click', ()=> onRedeemClick(btn.getAttribute('data-redeem')));
  });
  wrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=> onDeleteClick(btn.getAttribute('data-del')));
  });
  wrap.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=> onEditClick(btn.getAttribute('data-edit')));
  });
}
function rewardCardHTML(r, balance, tierCls){
  const pct = Math.min(100, Math.round(balance/r.cost*100));
  const afford = balance >= r.cost;
  const delConfirming = pendingDeleteId === r.id;
  const btnLabel = afford ? '兑换' : `还差 ${r.cost-balance} 分`;
  const iconColors = TIER_ICON_COLORS[tierCls] || TIER_ICON_COLORS.small;
  return `<div class="reward-card">
    <div class="reward-top">
      <div class="reward-icon-badge" style="background:${iconColors[0]};color:${iconColors[1]}">${iconForReward(r)}</div>
      <div class="reward-name-wrap">
        <div class="reward-name">${escapeHTML(r.name)}</div>
      </div>
      <div class="reward-cost mono">${r.cost} 分</div>
    </div>
    <div class="reward-bar"><div class="reward-bar-fill ${tierCls}" style="width:${pct}%"></div></div>
    <div class="reward-actions">
      <div class="reward-hint">${afford ? '已经攒够啦 🎉' : pct+'% 已攒够'}</div>
      <div class="reward-btn-row">
        <button class="btn-edit" data-edit="${r.id}">编辑</button>
        <button class="btn-del ${delConfirming?'confirming':''}" data-del="${r.id}">${delConfirming?'确认删除？':'删除'}</button>
        <button class="btn-redeem" data-redeem="${r.id}" ${afford?'':'disabled'}>${btnLabel}</button>
      </div>
    </div>
  </div>`;
}

function clearPendingDelete(){ pendingDeleteId=null; clearTimeout(pendingDeleteTimer); pendingDeleteTimer=null; }

function renderTasks(){
  const wrap = document.getElementById('tasksWrap');
  if(!tasks.length && !sections.length){
    wrap.innerHTML = '<div class="entry-empty">还没有板块，点下面「添加自定义板块」开始吧</div>';
    return;
  }
  const ORPHAN = '__orphan__';
  const known = new Set(sections.map(c=>c.id));
  const groups = {[ORPHAN]:[]};
  sections.forEach(c=>{ groups[c.id] = []; });
  // 找不到板块的任务（理论上不该出现）放进「未分类」，不会丢
  tasks.forEach(t=>{ groups[known.has(t.category) ? t.category : ORPHAN].push(t); });
  const list = groups[ORPHAN].length ? [...sections, {id:ORPHAN, label:'未分类', fixed:true}] : sections;
  wrap.innerHTML = list.map(c=>{
    const items = groups[c.id] || [];
    const delConfirming = pendingDeleteSectionId === c.id;
    const actions = !c.fixed ? `<span class="sec-actions">
        <button class="btn-del" data-rename-sec="${c.id}">改名</button>
        <button class="btn-del ${delConfirming?'confirming':''}" data-del-sec="${c.id}">${delConfirming?'确认删除？':'删除板块'}</button>
      </span>` : '';
    const body = items.length
      ? `<div class="reward-grid">${items.map(taskCardHTML).join('')}</div>`
      : `<div class="entry-empty">这个板块还没有任务，点下面「添加自定义任务」选它就行</div>`;
    return `<div class="tier-block">
      <div class="tier-title">${escapeHTML(c.label)}${actions}</div>
      ${body}
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-rename-sec]').forEach(btn=>{
    btn.addEventListener('click', ()=> openSectionModal(sections.find(x=>x.id===btn.getAttribute('data-rename-sec'))));
  });
  wrap.querySelectorAll('[data-del-sec]').forEach(btn=>{
    btn.addEventListener('click', ()=> onDeleteSectionClick(btn.getAttribute('data-del-sec')));
  });
  wrap.querySelectorAll('[data-log-task]').forEach(btn=>{
    btn.addEventListener('click', ()=> onLogTaskClick(btn.getAttribute('data-log-task')));
  });
  wrap.querySelectorAll('[data-edit-task]').forEach(btn=>{
    btn.addEventListener('click', ()=> onEditTaskClick(btn.getAttribute('data-edit-task')));
  });
  wrap.querySelectorAll('[data-del-task]').forEach(btn=>{
    btn.addEventListener('click', ()=> onDeleteTaskClick(btn.getAttribute('data-del-task')));
  });
}
function taskCardHTML(t){
  const delConfirming = pendingDeleteTaskId === t.id;
  return `<div class="reward-card">
    <div class="reward-top">
      <div class="reward-icon-badge" style="background:var(--teal-soft);color:var(--teal)">${iconForTask(t)}</div>
      <div class="reward-name-wrap">
        <div class="reward-name">${escapeHTML(t.name)}</div>
      </div>
      <div class="reward-cost mono">+${t.points} 分</div>
    </div>
    <div class="reward-btn-row">
      <button class="btn-edit" data-edit-task="${t.id}">编辑</button>
      <button class="btn-del ${delConfirming?'confirming':''}" data-del-task="${t.id}">${delConfirming?'确认删除？':'删除'}</button>
      <button class="btn-redeem" data-log-task="${t.id}">完成 ✓</button>
    </div>
  </div>`;
}
function clearPendingDeleteTask(){ pendingDeleteTaskId=null; clearTimeout(pendingDeleteTaskTimer); pendingDeleteTaskTimer=null; }
function onLogTaskClick(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  openTaskConfirm(t);
}
function openTaskConfirm(t){
  taskTarget = t;
  document.getElementById('taskConfirmText').textContent =
    `确定要记录一次「${t.name}」任务吗？将获得 ${t.points} 积分。`;
  document.getElementById('taskConfirmError').hidden = true;
  document.getElementById('taskConfirmModal').hidden = false;
}
function closeTaskConfirm(){
  document.getElementById('taskConfirmModal').hidden = true;
  taskTarget = null;
}
async function confirmTaskLog(){
  if(!taskTarget) return;
  const t = taskTarget;
  const errEl = document.getElementById('taskConfirmError');
  const btn = document.getElementById('confirmTaskBtn');
  btn.disabled = true;
  try{
    await logCol.add({kind:'earn', category:t.category||'custom', label:t.name, amount:t.points, note:'', dateISO:localISO(new Date()), ts:Date.now()});
    closeTaskConfirm();
    openCelebrate('task', t.name, t.points);
  }catch(e){
    errEl.textContent = '记录失败：' + (e && e.message ? e.message : '请重试');
    errEl.hidden = false;
  }finally{
    btn.disabled = false;
  }
}
function onEditTaskClick(id){
  const t = tasks.find(x=>x.id===id);
  if(t) openTaskModal(t);
}
function onDeleteTaskClick(id){
  if(pendingDeleteTaskId === id){
    clearPendingDeleteTask();
    tasksCol.doc(id).delete().catch(()=>{ showToast('删除失败，请重试'); });
  } else {
    clearPendingDeleteTask();
    pendingDeleteTaskId = id;
    render();
    pendingDeleteTaskTimer = setTimeout(()=>{ clearPendingDeleteTask(); render(); }, 4000);
  }
}
function openTaskModal(t){
  if(!sections.length){ showToast('请先添加一个板块'); return; }
  editingTaskId = t ? t.id : null;
  document.getElementById('taskModalTitle').textContent = t ? '编辑任务' : '添加自定义任务';
  document.getElementById('submitTask').textContent = t ? '保存修改' : '添加';
  document.getElementById('taskCategory').innerHTML = sections.map(c=>`<option value="${c.id}">${escapeHTML(c.label)}</option>`).join('');
  document.getElementById('taskName').value = t ? t.name : '';
  const cur = t && t.category;
  document.getElementById('taskCategory').value = sections.some(c=>c.id===cur) ? cur : sections[0].id;
  document.getElementById('taskPoints').value = t ? t.points : '';
  document.getElementById('taskFormError').hidden = true;
  document.getElementById('taskModal').hidden = false;
}
function closeTaskModal(){ document.getElementById('taskModal').hidden = true; editingTaskId = null; }
function submitTask(){
  const errEl = document.getElementById('taskFormError');
  const name = document.getElementById('taskName').value.trim();
  const category = document.getElementById('taskCategory').value;
  const rawPoints = document.getElementById('taskPoints').value;
  const points = Number(rawPoints);
  if(!name){ errEl.textContent='请填写任务名称'; errEl.hidden=false; return; }
  if(rawPoints===''||isNaN(points)||points<0){ errEl.textContent='请填写一个不小于 0 的积分数'; errEl.hidden=false; return; }
  const btn = document.getElementById('submitTask');
  btn.disabled = true;
  const payload = {name, category, points};
  const op = editingTaskId
    ? tasksCol.doc(editingTaskId).update(payload)
    : tasksCol.add({...payload, active:true, ts:Date.now()});
  op.then(()=>{ closeTaskModal(); showToast(editingTaskId ? '已保存修改' : '已添加任务'); })
    .catch((err)=>{ errEl.textContent='保存失败：'+(err&&err.message?err.message:'请重试'); errEl.hidden=false; })
    .finally(()=>{ btn.disabled = false; });
}

function openSectionModal(sec){
  editingSectionId = sec ? sec.id : null;
  document.getElementById('sectionModalTitle').textContent = sec ? '板块改名' : '添加自定义板块';
  document.getElementById('submitSection').textContent = sec ? '保存修改' : '添加';
  document.getElementById('sectionName').value = sec ? sec.label : '';
  document.getElementById('sectionFormError').hidden = true;
  document.getElementById('sectionModal').hidden = false;
  document.getElementById('sectionName').focus();
}
function closeSectionModal(){ document.getElementById('sectionModal').hidden = true; editingSectionId = null; }
function submitSection(){
  const errEl = document.getElementById('sectionFormError');
  const label = document.getElementById('sectionName').value.trim();
  if(!label){ errEl.textContent='请填写板块名称'; errEl.hidden=false; return; }
  const dup = sections.some(c=> c.label===label && c.id!==editingSectionId);
  if(dup){ errEl.textContent='已经有同名板块了'; errEl.hidden=false; return; }
  const btn = document.getElementById('submitSection');
  btn.disabled = true;
  const wasEditing = !!editingSectionId;
  const op = wasEditing
    ? sectionsCol.doc(editingSectionId).update({label, short:firebase.firestore.FieldValue.delete()})
    : sectionsCol.add({label, ts:Date.now()});
  op.then(()=>{ closeSectionModal(); showToast(wasEditing ? '已保存修改' : '已添加板块'); })
    .catch((err)=>{ errEl.textContent='保存失败：'+(err&&err.message?err.message:'请重试'); errEl.hidden=false; })
    .finally(()=>{ btn.disabled = false; });
}
function clearPendingDeleteSection(){ pendingDeleteSectionId=null; clearTimeout(pendingDeleteSectionTimer); pendingDeleteSectionTimer=null; }
function onDeleteSectionClick(id){
  const sec = sections.find(x=>x.id===id);
  if(!sec) return;
  if(tasks.some(t=>t.category===id)){
    showToast('板块里还有任务，先把任务删掉或移到别的板块');
    return;
  }
  if(pendingDeleteSectionId === id){
    clearPendingDeleteSection();
    sectionsCol.doc(sec.id).delete().catch(()=>{ showToast('删除失败，请重试'); });
  } else {
    clearPendingDeleteSection();
    pendingDeleteSectionId = id;
    render();
    pendingDeleteSectionTimer = setTimeout(()=>{ clearPendingDeleteSection(); render(); }, 4000);
  }
}

function onRedeemClick(id){
  const reward = rewards.find(r=>r.id===id);
  if(!reward) return;
  openRedeemConfirm(reward);
}

let redeemTarget = null;
function openRedeemConfirm(reward){
  redeemTarget = reward;
  document.getElementById('redeemConfirmText').textContent =
    `确定要兑换「${reward.name}」吗？将扣除 ${reward.cost} 积分。`;
  document.getElementById('redeemConfirmError').hidden = true;
  document.getElementById('redeemConfirmModal').hidden = false;
}
function closeRedeemConfirm(){
  document.getElementById('redeemConfirmModal').hidden = true;
  redeemTarget = null;
}
async function confirmRedeem(){
  if(!redeemTarget) return;
  const reward = redeemTarget;
  const errEl = document.getElementById('redeemConfirmError');
  const btn = document.getElementById('confirmRedeemBtn');
  btn.disabled = true;
  try{
    await logCol.add({kind:'spend', category:'reward', label:reward.name, amount:reward.cost, dateISO:localISO(new Date()), ts:Date.now()});
    closeRedeemConfirm();
    openCelebrate('reward', reward.name, reward.cost);
  }catch(e){
    errEl.textContent = '兑换失败：' + (e && e.message ? e.message : '请重试');
    errEl.hidden = false;
  }finally{
    btn.disabled = false;
  }
}
function openCelebrate(kind, name, amount){
  const html = kind === 'reward'
    ? `「${escapeHTML(name)}」奖励已兑换 🎉<br>已扣除 <span class="mono">${amount}</span> 积分。<br>奖励商店欢迎下次光临！`
    : `你太棒了！完成了一次「${escapeHTML(name)}」任务 🎉<br>已添加 <span class="mono">${amount}</span> 积分！`;
  document.getElementById('celebrateText').innerHTML = html;
  spawnConfetti();
  document.getElementById('celebrateModal').hidden = false;
}
function closeCelebrate(){
  document.getElementById('celebrateModal').hidden = true;
  document.getElementById('confettiWrap').innerHTML = '';
}
function spawnConfetti(){
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#E3A63D','#1C7A68','#7C2049','#48B69D','#C07F1F'];
  for(let i=0;i<28;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100+'%';
    el.style.background = colors[i%colors.length];
    el.style.animationDuration = (1.1+Math.random()*0.9)+'s';
    el.style.animationDelay = (Math.random()*0.25)+'s';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    wrap.appendChild(el);
  }
}
function onEditClick(id){
  const reward = rewards.find(r=>r.id===id);
  if(reward) openRewardModal(reward);
}
function onDeleteClick(id){
  if(pendingDeleteId === id){
    clearPendingDelete();
    rewardsCol.doc(id).delete().catch(()=>{ showToast('删除失败，请重试'); });
  } else {
    clearPendingDelete();
    pendingDeleteId = id;
    render();
    pendingDeleteTimer = setTimeout(()=>{ clearPendingDelete(); render(); }, 4000);
  }
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.getAttribute('data-tab')===name));
  document.getElementById('panel-log').hidden = name!=='log';
  document.getElementById('panel-rewards').hidden = name!=='rewards';
  document.getElementById('panel-history').hidden = name!=='history';
}

function openRewardModal(reward){
  editingRewardId = reward ? reward.id : null;
  document.getElementById('rewardModalTitle').textContent = reward ? '编辑奖励' : '添加自定义奖励';
  document.getElementById('submitReward').textContent = reward ? '保存修改' : '添加';
  document.getElementById('rewardName').value = reward ? reward.name : '';
  document.getElementById('rewardTier').value = reward ? reward.tier : 'small';
  document.getElementById('rewardCost').value = reward ? reward.cost : '';
  document.getElementById('rewardFormError').hidden = true;
  document.getElementById('rewardModal').hidden = false;
}
function closeRewardModal(){ document.getElementById('rewardModal').hidden = true; editingRewardId = null; }
function submitReward(){
  const errEl = document.getElementById('rewardFormError');
  const name = document.getElementById('rewardName').value.trim();
  const tier = document.getElementById('rewardTier').value;
  const rawCost = document.getElementById('rewardCost').value;
  const cost = Number(rawCost);
  if(!name){ errEl.textContent='请填写奖励名称'; errEl.hidden=false; return; }
  if(rawCost===''||isNaN(cost)||cost<0){ errEl.textContent='请填写一个不小于 0 的积分数'; errEl.hidden=false; return; }
  const btn = document.getElementById('submitReward');
  btn.disabled = true;
  const payload = {name, tier, cost};
  const op = editingRewardId
    ? rewardsCol.doc(editingRewardId).update(payload)
    : rewardsCol.add({...payload, active:true, ts:Date.now()});
  op.then(()=>{ closeRewardModal(); showToast(editingRewardId ? '已保存修改' : '已添加奖励'); })
    .catch((err)=>{ errEl.textContent='保存失败：'+(err&&err.message?err.message:'请重试'); errEl.hidden=false; })
    .finally(()=>{ btn.disabled = false; });
}

let uiWired = false;
function wireUI(){
  if(uiWired) return;
  uiWired = true;
  document.getElementById('tabs').addEventListener('click', e=>{
    const btn = e.target.closest('.tab');
    if(btn) switchTab(btn.getAttribute('data-tab'));
  });
  document.getElementById('openAddReward').addEventListener('click', openRewardModal);
  document.getElementById('cancelReward').addEventListener('click', closeRewardModal);
  document.getElementById('submitReward').addEventListener('click', submitReward);
  document.getElementById('rewardModal').addEventListener('click', e=>{ if(e.target.id==='rewardModal') closeRewardModal(); });
  document.getElementById('cancelRedeemConfirm').addEventListener('click', closeRedeemConfirm);
  document.getElementById('confirmRedeemBtn').addEventListener('click', confirmRedeem);
  document.getElementById('redeemConfirmModal').addEventListener('click', e=>{ if(e.target.id==='redeemConfirmModal') closeRedeemConfirm(); });
  document.getElementById('closeCelebrate').addEventListener('click', closeCelebrate);
  document.getElementById('openAddTask').addEventListener('click', ()=> openTaskModal());
  document.getElementById('cancelTask').addEventListener('click', closeTaskModal);
  document.getElementById('submitTask').addEventListener('click', submitTask);
  document.getElementById('taskModal').addEventListener('click', e=>{ if(e.target.id==='taskModal') closeTaskModal(); });
  document.getElementById('openAddSection').addEventListener('click', ()=> openSectionModal());
  document.getElementById('cancelSection').addEventListener('click', closeSectionModal);
  document.getElementById('submitSection').addEventListener('click', submitSection);
  document.getElementById('sectionName').addEventListener('keydown', e=>{ if(e.key==='Enter') submitSection(); });
  document.getElementById('sectionModal').addEventListener('click', e=>{ if(e.target.id==='sectionModal') closeSectionModal(); });
  document.getElementById('cancelTaskConfirm').addEventListener('click', closeTaskConfirm);
  document.getElementById('confirmTaskBtn').addEventListener('click', confirmTaskLog);
  document.getElementById('taskConfirmModal').addEventListener('click', e=>{ if(e.target.id==='taskConfirmModal') closeTaskConfirm(); });
}
</script>
</body>
</html>
