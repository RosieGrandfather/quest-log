<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日记 · 远征日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/study.css">
<link rel="stylesheet" href="css/journal.css">
</head>
<body>

<div class="app study-app">
  <div class="gate" id="gate">
    <h1>日记</h1>
    <p>登录后才能写日记，只有你自己能看到，手机电脑自动同步。</p>
    <button class="btn-google" id="signInBtn">用 Google 账号登录</button>
    <div class="gate-note" id="gateNote"></div>
  </div>

  <div id="journalRoot" hidden>
    <div class="study-topbar">
      <a class="back-home" href="index.html">← 返回远征日志</a>
      <a class="study-home-link" href="study.html">📚 学习区</a>
    </div>
    <header class="study-hero">
      <div>
        <div class="eyebrow">日记</div>
        <div class="today-status" id="todayStatus"></div>
      </div>
      <div class="streak"><span class="flame">📔</span>连续写&nbsp;<span class="mono" id="journalStreakNum">0</span>&nbsp;天</div>
    </header>

    <section class="j-page">
      <div class="j-head">
        <div>
          <div class="j-date" id="jDate"></div>
          <div class="j-sub" id="jSub"></div>
        </div>
        <div class="j-head-btns">
          <button class="btn-ghost j-today" id="backToday" hidden>回到今天</button>
          <button class="btn-ghost j-hist" id="histBtn" aria-expanded="false">🗓 历史记录</button>
        </div>
      </div>

      <section class="j-cal-wrap" id="calWrap" hidden>
        <div class="j-cal-head">
          <button class="j-nav" id="calPrev" aria-label="上个月">‹</button>
          <div class="j-cal-title" id="calTitle"></div>
          <button class="j-nav" id="calNext" aria-label="下个月">›</button>
        </div>
        <div class="j-cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="j-cal" id="jCal"></div>
        <div class="j-cal-hint">有圆点的日子写过日记，点一下打开</div>
      </section>

      <div id="jFields"></div>
      <div class="j-foot">
        <span id="jCount"></span>
        <span id="jStatus"></span>
      </div>
    </section>
  </div>
</div>

<div class="modal-backdrop" id="celebrateModal" hidden>
  <div class="modal celebrate-modal">
    <div class="confetti-wrap" id="confettiWrap"></div>
    <div class="celebrate-emoji">🎉</div>
    <h3>小惊喜！</h3>
    <p id="celebrateText" class="celebrate-text"></p>
    <button class="btn-primary" id="closeCelebrate" style="width:100%">收下</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="js/journal/main.js"></script>
</body>
</html>
