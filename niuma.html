<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牛马鼓励器 · 远征日志</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/study.css">
<link rel="stylesheet" href="css/niuma.css">
</head>
<body>

<div class="app study-app">
  <div class="gate" id="gate">
    <h1>牛马鼓励器</h1>
    <p>登录后填一次上下班时间和月薪，看着今天的工资一秒一秒往上涨。</p>
    <button class="btn-google" id="signInBtn">用 Google 账号登录</button>
    <div class="gate-note" id="gateNote"></div>
  </div>

  <div id="niumaRoot" hidden>
    <div class="study-topbar">
      <a class="back-home" href="index.html">← 返回远征日志</a>
      <button class="nm-settings-link" id="openSettings" type="button">⚙ 设置</button>
    </div>
    <header class="study-hero">
      <div>
        <div class="eyebrow">牛马鼓励器</div>
        <div class="today-status mono" id="clock"></div>
      </div>
      <div class="nm-phase" id="phaseLabel"></div>
    </header>

    <section class="nm-card">
      <div class="nm-countdown" id="countdown"></div>

      <div class="nm-stage" id="stage" data-cat="sleep">
        <svg class="nm-track" viewBox="0 0 260 260" aria-hidden="true">
          <circle cx="130" cy="130" r="104" class="nm-track-bg"/>
          <circle cx="130" cy="130" r="104" class="nm-track-done" id="trackDone" pathLength="100" stroke-dasharray="0 100"/>
        </svg>

        <!-- 跑道中间的圆：上班时追鱼，睡觉时（上班前 / 午休 / 公假 / 请假 / 周末打盹）睡觉，下班后发癫飞奔，都是循环 GIF -->
        <div class="nm-runner-disc" aria-hidden="true">
          <img class="nm-runner-gif nm-gif-run" src="img/niuma-cat.gif" alt="">
          <img class="nm-runner-gif nm-gif-sleep" src="img/niuma-sleep.gif" alt="">
          <img class="nm-runner-gif nm-gif-done" src="img/niuma-zoomies.gif" alt="">
        </div>

        <!-- 其他时候：小猫揣手趴着（睡觉 / 收工 / 周末玩毛线） -->
        <div class="nm-loaf-wrap" aria-hidden="true">
          <div class="nm-zzz"><span>z</span><span>z</span><span>Z</span></div>
          <svg class="nm-loaf" viewBox="0 0 170 120">
            <defs><clipPath id="loafClip"><path d="M40 108 Q34 60 90 56 Q148 56 146 108 Z"/></clipPath></defs>
            <path d="M140 104 Q166 102 160 80 Q156 70 148 74" class="nm-tail nm-tail-loaf"/>
            <path d="M40 108 Q34 60 90 56 Q148 56 146 108 Z" class="nm-white"/>
            <g clip-path="url(#loafClip)">
              <ellipse cx="118" cy="66" rx="26" ry="16" class="nm-black"/>
              <ellipse cx="96" cy="104" rx="12" ry="8" class="nm-black"/>
            </g>
            <path d="M40 108 Q34 60 90 56 Q148 56 146 108 Z" class="nm-outline"/>
            <g class="nm-paw"><ellipse cx="48" cy="106" rx="9" ry="5" class="nm-white-o"/></g>
            <g class="nm-head nm-loaf-head">
              <path d="M30 42 L32 18 L48 32 Z" class="nm-black"/>
              <path d="M60 30 L74 16 L76 40 Z" class="nm-black"/>
              <circle cx="54" cy="52" r="24" class="nm-white-o"/>
              <path d="M31 50 Q33 30 54 28 Q60 40 52 56 Q40 58 31 50 Z" class="nm-black"/>
              <g class="nm-eyes-open">
                <circle cx="45" cy="52" r="3" class="nm-eye-dot"/>
                <circle cx="63" cy="52" r="3"/>
              </g>
              <g class="nm-eyes-shut">
                <path d="M40 53 q5 4 10 0" class="nm-eye-line nm-eye-line-w"/>
                <path d="M58 53 q5 4 10 0" class="nm-eye-line"/>
              </g>
              <path d="M52 60 l4 0 l-2 3 Z" class="nm-nose"/>
              <path d="M50 65 q4 3 8 0" class="nm-mouth"/>
            </g>
          </svg>
          <!-- 收工：鱼吃完只剩骨头 -->
          <svg class="nm-bones" viewBox="0 0 60 30">
            <path d="M6 15 H44 M14 9 V21 M22 8 V22 M30 9 V21 M38 10 V20" />
            <circle cx="50" cy="15" r="6"/>
            <path d="M6 15 L1 9 M6 15 L1 21"/>
          </svg>
          <!-- 周末：毛线球 -->
          <svg class="nm-yarn" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="16"/>
            <path d="M6 14 Q20 22 34 12 M5 22 Q20 30 35 20 M12 6 Q18 20 14 35 M26 5 Q30 20 24 36"/>
          </svg>
        </div>
      </div>

      <div class="nm-earned-label" id="earnedLabel">今日已赚 · 估算</div>
      <div class="nm-earned mono" id="earned">S$0.0000</div>

      <div class="nm-progress">
        <div class="nm-progress-head"><b>今日工时进度 <span class="mono" id="progressPct">0%</span></b></div>
        <div class="nm-progress-sub" id="progressSub"></div>
        <div class="nm-bar"><div class="nm-bar-fill" id="barFill"></div></div>
      </div>

      <div class="nm-month">
        <span>本月累计</span>
        <b class="mono" id="monthTotal">S$0.00</b>
      </div>
      <div class="nm-month-sub" id="monthSub"></div>

      <button class="btn-ghost nm-leave" id="leaveBtn" type="button" hidden>🏖 今天请假</button>
    </section>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle">上班设置</h3>
    <p class="nm-modal-note">只存在你自己的账号里，和积分分开。周一到周五算工作日，公共假期和请假也照常算钱。</p>
    <div class="nm-grid">
      <div><label for="fStart">上班时间</label><input id="fStart" type="time" value="09:00"></div>
      <div><label for="fEnd">下班时间</label><input id="fEnd" type="time" value="18:00"></div>
      <div><label for="fLunchStart">午休开始</label><input id="fLunchStart" type="time" value="12:00"></div>
      <div><label for="fLunchEnd">午休结束</label><input id="fLunchEnd" type="time" value="13:00"></div>
    </div>
    <label for="fMonthly">月薪（S$）</label>
    <input id="fMonthly" type="number" inputmode="decimal" min="0" step="0.01" placeholder="比如 4500">
    <div class="form-error" id="formError"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelSettings" type="button">取消</button>
      <button class="btn-primary" id="saveSettings" type="button">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="js/niuma/main.js"></script>
</body>
</html>
